# Optional Postgres profile: spring.profiles.active=postgres
# Or set SPRING_DATASOURCE_* at runtime (takes precedence via application.properties).
#
# Neon / managed Postgres connection strings look like:
#   postgresql://user:pass@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
# Convert to JDBC for Spring:
#   jdbc:postgresql://ep-xxx.region.aws.neon.tech/neondb?sslmode=require
#
# Required env (example):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://ep-xxx.region.aws.neon.tech/neondb?sslmode=require
#   SPRING_DATASOURCE_USERNAME=neondb_owner
#   SPRING_DATASOURCE_PASSWORD=...
#   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
#
# DDL:
#   Use update for early environments; prefer validate once schema is frozen.
# Flyway (optional): not on the classpath — add spring-boot-starter-flyway later if needed.
#   Place scripts under src/main/resources/db/migration when enabling Flyway.
#
# Backup notes:
#   Prefer managed provider snapshots (Neon point-in-time) or pg_dump before ddl-auto changes.
#   Example: pg_dump "$DATABASE_URL" -Fc -f rfh-hms-$(date +%Y%m%d).dump

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.h2.console.enabled=false
