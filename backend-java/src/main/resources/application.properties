server.port=5000
spring.application.name=rfh-hms

app.jwt.secret=${JWT_SECRET:rfh_hms_dev_secret_change_me_please_use_32b}
app.jwt.expiration-ms=86400000

# Default local H2 file DB. Override with SPRING_DATASOURCE_URL for Postgres (see application-postgres.properties).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rfh-hms;MODE=PostgreSQL;DATABASE_TO_LOWER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
